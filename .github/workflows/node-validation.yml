name: Node validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, combat-execution]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check bot.mjs
      - run: node --check combat-ai.mjs
      - run: node --check advanced-combat.mjs
      - run: node --check special-combat.mjs
      - run: node --check sidekick-chat.mjs
